name: Salon Management Test Suite

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    name: Unit + Integration + E2E Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salondb

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    env:
      PYTHONPATH: .
      BASE_URL: http://127.0.0.1:5000


    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. PYTHON
      # ==========================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ==========================================
      # 3. DEPENDENCIES
      # ==========================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 4. PLAYWRIGHT
      # ==========================================
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium


      # ==========================================
      # 5. DATABASE
      # ==========================================
      - name: Initialize and seed test database
        run: |
          echo "Initializing database..."

          python -m app.models

          echo "Database ready!"


      # ==========================================
      # 6. START FLASK
      # ==========================================
      - name: Start Flask server
        run: |
          echo "Starting Flask..."

          nohup python -m app.index > flask.log 2>&1 &

          echo $! > flask.pid

          sleep 2

          echo "Flask process:"
          cat flask.pid


      # ==========================================
      # 7. HEALTH CHECK
      # ==========================================
      - name: Wait for Flask server
        run: |
          echo "Waiting for Flask..."

          for i in {1..30}; do

            if curl -sSf \
              http://127.0.0.1:5000/login \
              > /dev/null; then

              echo "Flask server is ready!"
              exit 0

            fi

            echo "Waiting for Flask... ($i/30)"

            # Nếu process Flask chết thì không cần
            # chờ hết 30 lần
            if ! kill -0 $(cat flask.pid) 2>/dev/null; then

              echo ""
              echo "Flask process stopped unexpectedly."

              echo "========== FLASK LOG =========="
              cat flask.log || true
              echo "==============================="

              exit 1
            fi

            sleep 2
          done

          echo ""
          echo "Flask did not become ready."

          echo "========== FLASK LOG =========="
          cat flask.log || true
          echo "==============================="

          exit 1


      # ==========================================
      # 8. ALL TESTS
      # Unit + Integration + E2E
      # ==========================================
      - name: Run complete test suite
        run: |
          pytest test


      # ==========================================
      # 9. DEBUG LOG
      # ==========================================
      - name: Show Flask log on failure
        if: failure()

        run: |
          echo "========== FLASK LOG =========="
          cat flask.log || true
          echo "==============================="


      # ==========================================
      # 10. HTML REPORT
      # ==========================================
      - name: Upload HTML test report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: salon-test-report

          path: reports/

          if-no-files-found: warn

          retention-days: 14


      # ==========================================
      # 11. PLAYWRIGHT ARTIFACTS
      # ==========================================
      - name: Upload Playwright artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: playwright-artifacts

          path: test-results/

          if-no-files-found: ignore

          retention-days: 14